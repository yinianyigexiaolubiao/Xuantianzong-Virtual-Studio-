name: Validate Xuantianzong Project

on:
  push:
    paths:
      - "data/world/**"
      - "data/canon/**"
      - "data/project/**"
      - "docs/canon/**"
      - "docs/project/**"
      - "docs/archive/**"
      - "CODEX.md"
      - "README.md"
      - "tools/validate_world_data.py"
      - "tools/validate_canon_registry.py"
      - "tools/validate_project_registry.py"
      - ".github/workflows/validate-canon.yml"
  pull_request:
    paths:
      - "data/world/**"
      - "data/canon/**"
      - "data/project/**"
      - "docs/canon/**"
      - "docs/project/**"
      - "docs/archive/**"
      - "CODEX.md"
      - "README.md"
      - "tools/validate_world_data.py"
      - "tools/validate_canon_registry.py"
      - "tools/validate_project_registry.py"
      - ".github/workflows/validate-canon.yml"

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate locked world data
        run: python tools/validate_world_data.py

      - name: Validate Canon registry and scoped overrides
        run: python tools/validate_canon_registry.py

      - name: Validate full project archive registry
        run: python tools/validate_project_registry.py
